name: FreelaHunter User
headline: Two-Developer Full-Stack Team | Python, FastAPI, APIs & Automation
bio: >-
  We are a two-developer full-stack team focused on building practical web
  systems, REST APIs, workflow automations and third-party integrations. We
  work across backend and frontend delivery, from scope clarification and
  implementation to testing, documentation and handoff. Our core stack
  includes Python, FastAPI, JavaScript/TypeScript, React/Next.js, SQL,
  PostgreSQL, Docker, Linux and Git. We prefer clear milestones, verifiable
  deliverables and communication inside the platform. Hosting, domains,
  managed databases, API credits and other paid services remain in the
  client's own accounts.
skills: [Python, FastAPI, REST APIs, JavaScript, TypeScript, React, Next.js, HTML, CSS, SQL, PostgreSQL, Docker, Linux, Git, GitHub, Automation, Integrations, n8n]
