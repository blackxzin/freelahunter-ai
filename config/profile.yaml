    role: Automation and QA developer
    description: >-
      Browser workflow with persistent sessions, selector checks, manual login,
      idempotency keys, atomic send reservations, per-client limits, dry-run
      defaults and confirmation checks after a submission attempt.
    technologies: [JavaScript, Playwright, SQLite, Testing, Git]
